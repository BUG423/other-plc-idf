[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-idf"
version = "0.2.0"
description = "PLC-IDF（曾用名 py2plc）：BESS Easy521 工具链 CLI——只读监测 / 虚拟从站 / 桥式 AutoShop build-flash 管线（默认 dry-run）"
readme = "wsl-tools/README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "PLC-IDF Contributors" }]
# 零第三方 CLI 依赖：argparse/tomllib/glob/subprocess 全部标准库；
# pymodbus 只属于被封装的 wsl-tools 脚本（已在 .venv），本包不 import 它。
dependencies = []

[project.scripts]
plcidf = "plc_idf.cli:main"   # 主入口
py2plc = "plc_idf.cli:main"   # 兼容别名（曾用名，行为与 plcidf 完全一致）

[tool.setuptools.packages.find]
where = ["src"]
include = ["plc_idf*"]

[tool.pytest.ini_options]
# 默认只跑本包测试；wsl-tools 65 项回归用 `pytest wsl-tools/tests` 单独跑
testpaths = ["src/plc_idf/tests"]
addopts = "-q"
