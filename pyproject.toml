[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-idf"
version = "0.2.0"
description = "PLC-IDF：多目标 CLI，Linux 原生 ST 编译/本地运行与 Easy521 AutoShop 兼容后端"
readme = "wsl-tools/README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "PLC-IDF Contributors" }]
# monitor/sim 在同一 Python 环境中启动；运行依赖必须随独立安装交付。
# simulator 使用 pymodbus 3.16 的运行时接口，先固定到实际验收的版本。
dependencies = ["pymodbus==3.16.1", "pyserial==3.5"]

[project.scripts]
plcidf = "plc_idf.cli:main"   # 主入口
py2plc = "plc_idf.cli:main"   # 兼容别名（曾用名，行为与 plcidf 完全一致）

[tool.setuptools.packages.find]
where = ["src"]
include = ["plc_idf*"]
exclude = ["plc_idf.tests*"]

[tool.pytest.ini_options]
# 默认只跑本包测试；wsl-tools 65 项回归用 `pytest wsl-tools/tests` 单独跑
testpaths = ["src/plc_idf/tests"]
addopts = "-q"
