name: PLC-IDF task progress

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 1 * * 1' # 周一 09:00 Asia/Shanghai；GitHub 可能延迟执行
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plcidf-progress
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update tracking issue from task state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_github_progress.py
