name: Software tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install source checkout and baseline dependencies
        run: python -m pip install -r requirements-ci.txt -e .
      - name: CLI tests with Windows enumeration excluded
        run: python -m pytest src/plc_idf/tests -q -k 'not test_devices_real_readonly'
      - name: Monitor protocol and loopback integration tests
        run: python -m pytest wsl-tools/tests -q
      - name: Offline tool contracts, protocols and loopback tests
        # Collect both unittest classes and pytest functions, including newly
        # added protocol/link workers. No Windows or PLC operations run here.
        run: python -m pytest tools/tests -q
      - name: Build sdist and install wheel outside checkout
        run: python tools/check_distribution.py --report /tmp/plcidf-distribution.json

  open-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux compiler build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake bison flex lld
          python -m pip install -r requirements-ci.txt -e .
      - name: Real Linux ARM relocatable linking and duplicate-symbol failure
        env:
          PLCIDF_TEST_LLD: /usr/bin/ld.lld
        run: python -m pytest tools/tests/test_link_vendor_application.py -q -k real_linux_lld
      - name: Bootstrap pinned MatIEC without Windows
        run: python tools/bootstrap_open_linux.py --directory /tmp/plcidf-matiec --jobs 2
      - name: Real ST compiler and runtime regression
        env:
          PLCIDF_OPEN_LINUX_TOOLCHAIN: /tmp/plcidf-matiec
        run: python -m pytest src/plc_idf/tests/test_open_linux.py src/plc_idf/tests/test_open_linux_signals.py src/plc_idf/tests/test_verification.py -q
      - name: CLI compile, deploy, run, observe, stop, and changed-program evidence
        run: python tools/check_open_linux.py --toolchain-dir /tmp/plcidf-matiec --report /tmp/plcidf-open-linux.json
      - name: AI workflow with logic regression, compiler failure and scenario repair
        run: python tools/check_ai_workflow.py --toolchain-dir /tmp/plcidf-matiec --report /tmp/plcidf-ai-workflow.json
      - name: Installed wheel creates and verifies a control project outside checkout
        run: python tools/check_distribution.py --toolchain-dir /tmp/plcidf-matiec --report /tmp/plcidf-installed-ai-workflow.json
