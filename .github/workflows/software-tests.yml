name: Software tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install source checkout and baseline dependencies
        run: python -m pip install -r requirements-ci.txt -e .
      - name: CLI tests with Windows enumeration excluded
        run: python -m pytest src/plc_idf/tests -q -k 'not test_devices_real_readonly'
      - name: Monitor protocol and loopback integration tests
        run: python -m pytest wsl-tools/tests -q
      - name: GitHub progress renderer tests
        run: python -m unittest discover -s tools/tests -v
